syntax = "proto3";
package casedigestor.attestations.v1;

option go_package = "github.com/cliffordx/opencasedigests/chain/x/attestations/types";

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "casedigestor/attestations/v1/digest.proto";

// Msg defines the attestations module's state-changing transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // SubmitDigestDraft creates a new AI-generated or contributor-submitted
  // case digest, pinning it to IPFS and recording its checksum on-chain.
  rpc SubmitDigestDraft(MsgSubmitDigestDraft) returns (MsgSubmitDigestDraftResponse);

  // SubmitCuratorRevision allows a community curator to submit an improved
  // version of an existing digest during the COMMUNITY_REVIEW stage.
  rpc SubmitCuratorRevision(MsgSubmitCuratorRevision) returns (MsgSubmitCuratorRevisionResponse);

  // AttestDigest records a verified attorney's peer review and rubric scores,
  // potentially advancing the digest to BAR_ATTESTED stage.
  rpc AttestDigest(MsgAttestDigest) returns (MsgAttestDigestResponse);

  // LinkSubsequentRuling creates a citation edge between an existing digest
  // and a newer Supreme Court decision that affects the underlying doctrine.
  rpc LinkSubsequentRuling(MsgLinkSubsequentRuling) returns (MsgLinkSubsequentRulingResponse);
}

// ----- Message Definitions -----

// MsgSubmitDigestDraft creates a new case digest anchored on IPFS.
message MsgSubmitDigestDraft {
  option (cosmos.msg.v1.signer) = "creator";

  // Bech32 address of the submitter or AI coordinator
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Supreme Court docket number (e.g., "G.R. No. 212345")
  string gr_number = 2;

  // IPFS CIDv1 of the structured digest JSON
  string ipfs_cid = 3;

  // Hex-encoded SHA-256 checksum of the raw file bytes
  string sha256_checksum = 4;
}

// MsgSubmitDigestDraftResponse is returned after a successful draft submission.
message MsgSubmitDigestDraftResponse {
  string digest_id = 1;
  DigestStage current_stage = 2;
}

// MsgSubmitCuratorRevision allows a curator to submit an improved version
// of a digest that is currently in the COMMUNITY_REVIEW stage.
message MsgSubmitCuratorRevision {
  option (cosmos.msg.v1.signer) = "curator";

  // Bech32 address of the community curator
  string curator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // ID of the digest being revised
  string digest_id = 2;

  // IPFS CIDv1 of the revised digest JSON
  string revised_ipfs_cid = 3;

  // Hex-encoded SHA-256 checksum of the revised file bytes
  string revised_sha256_checksum = 4;

  // Optional IPFS CID of a changelog or revision notes document
  string revision_notes_ipfs_cid = 5;
}

// MsgSubmitCuratorRevisionResponse is returned after a successful curator revision.
message MsgSubmitCuratorRevisionResponse {
  string digest_id = 1;
  string updated_ipfs_cid = 2;
}

// MsgAttestDigest records a verified attorney's peer attestation with rubric scores.
message MsgAttestDigest {
  option (cosmos.msg.v1.signer) = "attorney";

  // Bech32 address of the verified attorney (must hold ROLE_COUNSEL_REVIEWER)
  string attorney = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // ID of the digest being attested
  string digest_id = 2;

  // Rubric score for doctrinal accuracy (1-5)
  uint32 doctrine_accuracy_score = 3;

  // Rubric score for citation integrity (1-5)
  uint32 citation_integrity_score = 4;

  // Optional IPFS CID of detailed peer review critique
  string review_notes_ipfs_cid = 5;
}

// MsgAttestDigestResponse is returned after a successful attestation.
message MsgAttestDigestResponse {
  string digest_id = 1;
  DigestStage updated_stage = 2;
  uint32 total_attestations = 3;
}

// MsgLinkSubsequentRuling creates a citation edge linking an existing digest
// to a newer Supreme Court decision that affects the underlying doctrine.
message MsgLinkSubsequentRuling {
  option (cosmos.msg.v1.signer) = "author";

  // Bech32 address of the contributor creating this citation edge
  string author = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Digest ID of the older doctrine being evaluated
  string target_digest_id = 2;

  // G.R. number of the newer, superseding decision
  string superseding_gr_number = 3;

  // How the newer ruling relates to the older doctrine
  CitationRelation relation = 4;

  // IPFS CID of the legal analysis justifying this citation edge
  string ipfs_proof_cid = 5;
}

// MsgLinkSubsequentRulingResponse is returned after a successful citation link.
message MsgLinkSubsequentRulingResponse {
  string target_digest_id = 1;
  CitationRelation relation = 2;
}
